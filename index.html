<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تهاتر ملک</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#20242a;font-family:Tahoma,Arial,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px}.head{background:#fff;border-radius:20px;padding:24px 20px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}h1{margin:0 0 8px;font-size:26px}.desc{font-size:14px;line-height:2;color:#68717c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:0;background:#fff;border-radius:18px;padding:20px 14px;text-align:right;font:inherit;box-shadow:0 3px 14px rgba(0,0,0,.05);cursor:pointer}.icon{font-size:24px;margin-bottom:10px}.title{font-size:15px;font-weight:700}.small{display:block;margin-top:6px;color:#7b838d;font-size:11px;line-height:1.7}.footer{text-align:center;color:#9299a2;font-size:10px;margin:18px 0}.toast{position:fixed;left:16px;right:16px;bottom:18px;background:#20242a;color:#fff;padding:13px 15px;border-radius:12px;text-align:center;display:none;font-size:13px}
</style></head>
<body><main class="app">
<section class="head"><h1>تهاتر ملک</h1><div class="desc">سامانه خدمات و مدیریت فایل‌های تهاتر ملک</div></section>
<section class="grid">
<button class="item" onclick="show('ثبت فایل')"><div class="icon">🏠</div><div class="title">ثبت فایل</div><span class="small">ثبت مشخصات ملک برای تهاتر</span></button>
<button class="item" onclick="show('جستجوی فایل')"><div class="icon">🔎</div><div class="title">جستجوی فایل</div><span class="small">یافتن فایل‌های مناسب</span></button>
<button class="item" onclick="show('فایل‌های من')"><div class="icon">📁</div><div class="title">فایل‌های من</div><span class="small">مدیریت فایل‌های ثبت‌شده</span></button>
<button class="item" onclick="show('درخواست تهاتر')"><div class="icon">🔄</div><div class="title">درخواست تهاتر</div><span class="small">ثبت و ارسال درخواست</span></button>
<button class="item" onclick="show('پیگیری درخواست')"><div class="icon">📋</div><div class="title">پیگیری درخواست</div><span class="small">مشاهده وضعیت درخواست‌ها</span></button>
<button class="item" onclick="show('پشتیبانی')"><div class="icon">💬</div><div class="title">پشتیبانی</div><span class="small">ارتباط و دریافت راهنمایی</span></button>
</section><div class="footer">نسخه اولیه — آماده توسعه و اتصال به CRM</div></main><div id="toast" class="toast"></div>
<script>function show(x){const t=document.getElementById('toast');t.textContent='بخش «'+x+'» — در نسخه بعدی فعال می‌شود.';t.style.display='block';setTimeout(()=>t.style.display='none',1800)}</script>
</body></html>
