<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تهاتر ملک</title>

  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .section {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      background: #168a45;
    }

    .back-btn {
      margin-bottom: 15px;
      background: #666;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>تهاتر ملک</h1>

  <div class="menu">
    <button onclick="showSection('register')">ثبت فایل</button>
    <button onclick="showMessage('جستجوی فایل')">جستجوی فایل</button>
    <button onclick="showMessage('فایل‌های من')">فایل‌های من</button>
    <button onclick="showMessage('درخواست تهاتر')">درخواست تهاتر</button>
    <button onclick="showMessage('پیگیری درخواست')">پیگیری درخواست</button>
    <button onclick="showMessage('پشتیبانی')">پشتیبانی</button>
  </div>

  <div id="register" class="section">

    <button class="back-btn" onclick="showHome()">بازگشت</button>

    <h2>ثبت فایل تهاتر</h2>

    <label>شهر</label>
    <input id="city" type="text">

    <label>منطقه / محله</label>
    <input id="area" type="text">

    <label>نوع ملک</label>
    <input id="propertyType" type="text">

    <label>مساحت</label>
    <input id="areaSize" type="text">

    <label>وضعیت سند</label>
    <input id="deedStatus" type="text">

    <label>ارزش تقریبی</label>
    <input id="estimatedValue" type="text">

    <label>توضیحات ملک</label>
    <textarea id="propertyDescription"></textarea>

    <label>نام مالک</label>
    <input id="ownerName" type="text">

    <label>شماره تماس مالک</label>
    <input id="ownerPhone" type="tel">

    <label>خواسته دقیق مالک</label>
    <textarea id="ownerRequest"></textarea>

    <label>محدوده موردنظر برای تهاتر</label>
    <input id="barterArea" type="text">

    <label>نوع ملک موردنظر در تهاتر</label>
    <input id="barterPropertyType" type="text">

    <label>مابه‌التفاوت</label>
    <input id="difference" type="text">

    <label>شرایط / توضیحات تهاتر</label>
    <textarea id="barterConditions"></textarea>

    <label>تصاویر / مدارک</label>
    <input id="documents" type="text">

    <label>منبع فایل</label>
    <input id="source" type="text">

    <button class="submit-btn" onclick="submitFile()">
      ثبت فایل
    </button>

  </div>

</div>

<script>

const CRM_URL =
"https://script.google.com/macros/s/AKfycbwrO4jgzEkch7-09IuzdjXnxC4ICtdg-h5tRVhByKnT5ebVCeRJ3WZHYJhLv1xUBq5MhQ/exec";


function showSection(id) {

  document.querySelector(".menu").style.display = "none";

  document.querySelectorAll(".section").forEach(function(section) {
    section.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}


function showHome() {

  document.querySelector(".menu").style.display = "grid";

  document.querySelectorAll(".section").forEach(function(section) {
    section.classList.remove("active");
  });

}


function showMessage(name) {

  alert(name + " در نسخه بعدی فعال می‌شود.");

}


function submitFile() {

  const data = {

    city: document.getElementById("city").value,
    area: document.getElementById("area").value,
    propertyType: document.getElementById("propertyType").value,
    areaSize: document.getElementById("areaSize").value,
    deedStatus: document.getElementById("deedStatus").value,
    estimatedValue: document.getElementById("estimatedValue").value,
    propertyDescription: document.getElementById("propertyDescription").value,
    ownerName: document.getElementById("ownerName").value,
    ownerPhone: document.getElementById("ownerPhone").value,
    ownerRequest: document.getElementById("ownerRequest").value,
    barterArea: document.getElementById("barterArea").value,
    barterPropertyType: document.getElementById("barterPropertyType").value,
    difference: document.getElementById("difference").value,
    barterConditions: document.getElementById("barterConditions").value,
    documents: document.getElementById("documents").value,
    source: document.getElementById("source").value

  };


  const form = document.createElement("form");

  form.method = "POST";
  form.action = CRM_URL;
  form.target = "_blank";
  form.style.display = "none";


  Object.keys(data).forEach(function(key) {

    const input = document.createElement("input");

    input.type = "hidden";
    input.name = key;
    input.value = data[key] || "";

    form.appendChild(input);

  });


  document.body.appendChild(form);

  form.submit();

  document.body.removeChild(form);


  alert("فایل برای ثبت در CRM ارسال شد.");

}

</script>

</body>
</html>
